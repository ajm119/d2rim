# Builds the game and publishes it to GitHub Pages.
#
# The site is a project page, so it is served from
# https://<owner>.github.io/<repo>/ and the bundle must be built with a matching
# base path. VITE_BASE supplies it (see vite.config.ts); it is derived from the
# repository name so a fork deploys correctly without editing this file.
name: Deploy to GitHub Pages

on:
  push:
    # main is listed so the site redeploys once this work is merged. The
    # github-pages environment restricts deployment to the default branch by
    # default, so deploying from the feature branch additionally requires
    # allowing it under Settings > Environments > github-pages.
    branches: [main, claude/diablo2-skyrim-poc-9xj3j5]
  workflow_dispatch:

# GITHUB_TOKEN needs pages:write to deploy and id-token:write for the
# deploy-pages OIDC handshake.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a newer commit supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # public/assets/* is gitignored — the ~80 MB of textures, models and HDRIs
      # are fetched from npm and GitHub rather than committed. Both the test
      # suite (which decodes real EXR plates) and the build need them on disk.
      # The fetcher is idempotent and verifies every file by SHA-256, so a warm
      # cache is re-verified rather than blindly trusted.
      - name: Cache fetched assets
        uses: actions/cache@v4
        with:
          path: public/assets
          key: assets-${{ hashFiles('tools/assets/manifest.json') }}

      - name: Fetch assets
        run: npm run assets

      # Transcode the fetched JPEGs to KTX2/Basis. This is not optional polish:
      # a JPEG decodes to RGBA8 and costs 21.3 MiB of VRAM per 2048x2048 plate,
      # and the 32 plates the game preloads came to ~682 MB of texture demand
      # against a 256 MB cache budget. The result was constant eviction of
      # textures that live materials were still sampling, and eventually
      # Chromium's out-of-memory renderer kill ("Error code: 5") on the
      # deployed build. ETC1S transcodes to BC1/ETC2 and stays compressed on
      # the GPU: 2.67 MiB per plate, 89 MB for the set, zero evictions.
      #
      # If this step is ever removed the game still runs — the AssetManager
      # falls back to the source JPEGs — but it falls straight back into the
      # crash. The `assets:ktx2` cache key includes the fetch manifest because
      # the encode input is whatever `npm run assets` just produced.
      - name: Cache compressed textures
        uses: actions/cache@v4
        with:
          path: public/assets/textures-ktx2
          key: ktx2-${{ hashFiles('tools/assets/manifest.json', 'tools/assets/encode-ktx2.mjs') }}

      - name: Transcode textures to KTX2
        run: npm run assets:ktx2

      # Guard the deploy: a red build or a failing suite should not ship.
      - run: npm test

      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # Pages is enabled on the repository with Source = GitHub Actions.
      # `enablement: true` is deliberately not set: GITHUB_TOKEN cannot create a
      # Pages site ("Resource not accessible by integration"), so it only ever
      # produced a confusing hard failure when the site did not exist. Enabling
      # Pages is a one-time repository setting, not something CI can bootstrap.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
