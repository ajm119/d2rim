# Builds the game and publishes it to GitHub Pages.
#
# The site is a project page, so it is served from
# https://<owner>.github.io/<repo>/ and the bundle must be built with a matching
# base path. VITE_BASE supplies it (see vite.config.ts); it is derived from the
# repository name so a fork deploys correctly without editing this file.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/diablo2-skyrim-poc-9xj3j5]
  workflow_dispatch:

# GITHUB_TOKEN needs pages:write to deploy and id-token:write for the
# deploy-pages OIDC handshake.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a newer commit supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # public/assets/* is gitignored — the ~80 MB of textures, models and HDRIs
      # are fetched from npm and GitHub rather than committed. Both the test
      # suite (which decodes real EXR plates) and the build need them on disk.
      # The fetcher is idempotent and verifies every file by SHA-256, so a warm
      # cache is re-verified rather than blindly trusted.
      - name: Cache fetched assets
        uses: actions/cache@v4
        with:
          path: public/assets
          key: assets-${{ hashFiles('tools/assets/manifest.json') }}

      - name: Fetch assets
        run: npm run assets

      # Guard the deploy: a red build or a failing suite should not ship.
      - run: npm test

      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # Pages is enabled on the repository with Source = GitHub Actions.
      # `enablement: true` is deliberately not set: GITHUB_TOKEN cannot create a
      # Pages site ("Resource not accessible by integration"), so it only ever
      # produced a confusing hard failure when the site did not exist. Enabling
      # Pages is a one-time repository setting, not something CI can bootstrap.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
