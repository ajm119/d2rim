<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!-- Inline favicon: avoids a 404 on every load, including headless capture. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23140b08'/><path d='M16 5l9 8-9 14-9-14z' fill='%23c0563a'/></svg>"
    />
    <title>d2rim</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #05070a;
        color: #d8dde6;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      /*
       * The canvas fills the window in CSS pixels. Its backing-store size is
       * set by the renderer from devicePixelRatio, so these rules must never
       * be fought by inline width/height attributes -- which is why the
       * renderer is configured with `updateStyle: false`.
       */
      #viewport {
        display: block;
        width: 100vw;
        height: 100vh;
        /* Avoid the browser hijacking drags/gestures over the game surface. */
        touch-action: none;
        outline: none;
      }

      /*
       * Boot curtain. Fades out once main.ts marks the document ready, so the
       * first thing seen is a rendered frame rather than a flash of black.
       */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: #05070a;
        color: #6c7787;
        font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        transition: opacity 420ms ease;
      }

      body.d2rim-ready #boot {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport" tabindex="0"></canvas>
    <div id="boot">initialising renderer</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
